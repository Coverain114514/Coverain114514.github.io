<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Weekly Online Schedule</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 12px; }
        .login-panel {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; max-width: 620px; margin: 0 auto 20px;
            display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
        }
        .login-panel input {
            flex: 1; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #f0f6fc; min-width: 200px;
        }
        .login-panel button {
            padding: 8px 18px; background: #238636; border: 1px solid #2ea043;
            border-radius: 6px; color: white; cursor: pointer; font-weight: 600;
        }
        .user-badge {
            text-align: center; margin-bottom: 8px; font-size: 0.9rem; color: #8b949e;
        }
        .user-badge strong { color: #f0c040; }
        .status-indicator {
            text-align: center; margin-bottom: 8px; font-size: 0.95rem;
        }
        .status-online { color: #3fb950; font-weight: bold; }
        .status-offline { color: #f85149; font-weight: bold; }
        .debug-info {
            text-align: center; font-size: 0.8rem; color: #8b949e; margin-bottom: 12px;
            font-family: monospace;
        }
        .grid-container {
            overflow-x: auto; background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 10px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; table-layout: fixed; }
        th, td { border: 1px solid #21262d; padding: 4px 2px; text-align: center; font-size: 0.7rem; height: 28px; }
        th { background: #21262d; color: #58a6ff; position: sticky; top: 0; z-index: 3; }
        .time-header { font-size: 0.65rem; white-space: nowrap; }
        td.marked {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            font-weight: bold;
        }
        td.marked::after {
            content: attr(data-count);
            font-size: 0.65rem;
            margin-left: 2px;
        }
        .legend { display: flex; justify-content: center; gap: 18px; margin: 10px 0 15px; font-size: 0.8rem; }
        .legend span::before { content: '■'; margin-right: 5px; color: rgba(88, 166, 255, 0.15); }
        .refresh-note { text-align: center; font-size: 0.75rem; color: #484f58; margin-top: 10px; }
        .manual-refresh {
            display: block; margin: 0 auto 10px; padding: 6px 16px;
            background: #30363d; border: 1px solid #58a6ff; color: #58a6ff;
            border-radius: 4px; cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📅 Torn Weekly Online Schedule</h1>

    <div class="login-panel">
        <input type="text" id="apiKeyInput" placeholder="Paste your Torn API key">
        <button id="loginBtn">🔑 Sign In</button>
    </div>

    <div id="userBadge" class="user-badge" style="display:none;">
        Signed in as <strong id="userNameDisplay"></strong> (ID: <strong id="userIdDisplay"></strong>)
    </div>

    <div id="onlineStatus" class="status-indicator" style="display:none;">
        Current Torn status: <span id="statusText"></span>
        <br>
        <span id="lastActionInfo" class="debug-info"></span>
    </div>

    <button id="manualRefreshBtn" class="manual-refresh">🔄 Refresh Grid Now</button>

    <div class="legend"><span>Marked online this week</span></div>

    <div class="grid-container" id="gridContainer">
        <p style="text-align:center;padding:30px;color:#8b949e;">Sign in to see the schedule.</p>
    </div>
    <div class="refresh-note">Auto‑checks every 30 seconds · Marks persist all week</div>

    <script>
        // ========== SUPABASE CONFIG ==========
        const SUPABASE_URL = 'https://ohgvzzcojnjqzvyizyxs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oZ3Z6emNvam5qcXp2eWl6eXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0MDUsImV4cCI6MjEwMjA0MzQwNX0.RR2L4Unhzs9nZC8_FfNoiBSS5bJSOWYJVYzSTZjZR4M';

        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const SLOTS = 48;
        const ONLINE_THRESHOLD_SEC = 300;

        let currentUser = null;
        let pollInterval = null;
        let gridRefreshInterval = null;

        // ---------- Helpers ----------
        function getCurrentWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            return Array.from({length: 7}, (_, i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d.toISOString().slice(0,10);
            });
        }

        function getSlotTime(slot) {
            const h = String(Math.floor(slot / 2)).padStart(2, '0');
            const m = slot % 2 === 0 ? '00' : '30';
            return `${h}:${m}`;
        }

        // ---------- Torn API (explicitly request last_action) ----------
        async function verifyTornKey(key) {
            try {
                const res = await fetch(`https://api.torn.com/user/?selections=basic,last_action&key=${key}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error.error);
                return { id: data.player_id, name: data.name };
            } catch (err) {
                console.error('[Torn] Key verification failed:', err);
                return null;
            }
        }

        async function checkOnlineStatus(key) {
            try {
                // Force basic + last_action selection
                const url = `https://api.torn.com/user/?selections=basic,last_action&key=${key}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.error) return { online: false, lastAction: null, secondsAgo: null, rawData: null };

                const lastAction = data.last_action;
                if (!lastAction || !lastAction.timestamp) {
                    console.warn('[Torn] No last_action in response, full data:', data);
                    return { online: false, lastAction: null, secondsAgo: null, rawData: data };
                }

                const timestamp = lastAction.timestamp;
                const nowSec = Math.floor(Date.now() / 1000);
                const secondsAgo = nowSec - timestamp;
                const online = secondsAgo < ONLINE_THRESHOLD_SEC;
                return { online, lastAction: timestamp, secondsAgo, rawData: data };
            } catch (err) {
                console.error('[Torn] Online check error:', err);
                return { online: false, lastAction: null, secondsAgo: null, rawData: null };
            }
        }

        function getCurrentDateAndSlot() {
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10);
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();
            const slot = hours * 2 + (minutes >= 30 ? 1 : 0);
            return { date: dateStr, slot };
        }

        // ---------- Supabase REST ----------
        function supabaseHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        async function upsertPresence(userId, date, slot) {
            const checkUrl = `${SUPABASE_URL}/rest/v1/presence?user_id=eq.${encodeURIComponent(userId)}&date=eq.${encodeURIComponent(date)}&slot=eq.${slot}&select=id`;
            let res = await fetch(checkUrl, { headers: supabaseHeaders() });
            if (!res.ok) { console.error('Check failed', res.status); return; }
            const existing = await res.json();

            if (existing.length === 0) {
                const insertUrl = `${SUPABASE_URL}/rest/v1/presence`;
                res = await fetch(insertUrl, {
                    method: 'POST',
                    headers: supabaseHeaders(),
                    body: JSON.stringify({ user_id: userId, date, slot, timestamp: Date.now() })
                });
                if (res.ok) console.log('[Supabase] Marked slot');
                else console.error('Insert failed', await res.json());
            }
        }

        async function fetchPresence(dates) {
            const dateList = dates.map(d => `"${d}"`).join(',');
            const url = `${SUPABASE_URL}/rest/v1/presence?date=in.(${encodeURIComponent(dateList)})&select=*`;
            const res = await fetch(url, { headers: supabaseHeaders() });
            if (!res.ok) { console.error('Fetch failed', await res.json()); return []; }
            return await res.json();
        }

        // ---------- Update presence ----------
        async function updateMyPresence() {
            if (!currentUser) return;
            const savedKey = localStorage.getItem('torn_api_key');
            if (!savedKey) return;

            const status = await checkOnlineStatus(savedKey);

            // Update UI
            document.getElementById('onlineStatus').style.display = 'block';
            const statusText = document.getElementById('statusText');
            const lastActionInfo = document.getElementById('lastActionInfo');

            if (status.online) {
                statusText.innerHTML = '<span class="status-online">● ONLINE</span>';
            } else {
                statusText.innerHTML = '<span class="status-offline">○ OFFLINE</span>';
            }

            if (status.lastAction) {
                const dateStr = new Date(status.lastAction * 1000).toLocaleString();
                lastActionInfo.innerHTML = `Last action: ${status.lastAction} (${dateStr}) · ${status.secondsAgo}s ago`;
            } else {
                lastActionInfo.innerHTML = '⚠ No last_action data – check API key permissions in Torn!';
            }

            if (status.online) {
                const { date, slot } = getCurrentDateAndSlot();
                await upsertPresence(currentUser.id, date, slot);
                console.log(`✅ Marked online at slot ${slot}`);
            } else {
                console.log(`⏸ Offline or no timestamp available`);
            }
        }

        // ---------- Load & render grid ----------
        async function loadAndRenderGrid() {
            const dates = getCurrentWeekDates();
            const data = await fetchPresence(dates);

            const cellMap = {};
            data.forEach(row => {
                const key = `${row.date}_${row.slot}`;
                if (!cellMap[key]) cellMap[key] = new Set();
                cellMap[key].add(row.user_id);
            });

            renderGrid(dates, cellMap);
        }

        function renderGrid(dates, cellMap) {
            let html = '<table><thead><tr><th>Time</th>';
            dates.forEach((date, i) => {
                html += `<th>${DAYS[i]}<br>${date.slice(5)}</th>`;
            });
            html += '</tr></thead><tbody>';

            for (let s = 0; s < SLOTS; s++) {
                html += '<tr>';
                html += `<td class="time-header">${getSlotTime(s)}</td>`;
                dates.forEach(date => {
                    const key = `${date}_${s}`;
                    const users = cellMap[key]?.size || 0;
                    const cls = users > 0 ? 'marked' : '';
                    html += `<td class="${cls}" data-count="${users > 1 ? users : ''}"></td>`;
                });
                html += '</tr>';
            }
            html += '</tbody></table>';
            document.getElementById('gridContainer').innerHTML = html;
        }

        // ---------- Login ----------
        async function handleLogin() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return alert('Please enter your Torn API key');

            const user = await verifyTornKey(key);
            if (!user) return alert('Invalid API key.');

            currentUser = user;
            localStorage.setItem('torn_api_key', key);
            document.getElementById('userBadge').style.display = 'block';
            document.getElementById('userNameDisplay').textContent = user.name;
            document.getElementById('userIdDisplay').textContent = user.id;
            document.getElementById('loginBtn').textContent = '🔄 Signed in';

            if (pollInterval) clearInterval(pollInterval);
            if (gridRefreshInterval) clearInterval(gridRefreshInterval);

            await updateMyPresence();
            await loadAndRenderGrid();

            pollInterval = setInterval(updateMyPresence, 30000);
            gridRefreshInterval = setInterval(loadAndRenderGrid, 30000);
        }

        // ---------- Bind events ----------
        function bindEvents() {
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('manualRefreshBtn').addEventListener('click', async () => {
                if (!currentUser) return alert('Please sign in first.');
                await updateMyPresence();
                await loadAndRenderGrid();
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindEvents);
        else bindEvents();

        // Auto‑login
        (async () => {
            const savedKey = localStorage.getItem('torn_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                const user = await verifyTornKey(savedKey);
                if (user) {
                    currentUser = user;
                    document.getElementById('userBadge').style.display = 'block';
                    document.getElementById('userNameDisplay').textContent = user.name;
                    document.getElementById('userIdDisplay').textContent = user.id;
                    document.getElementById('loginBtn').textContent = '🔄 Signed in';
                    await updateMyPresence();
                    await loadAndRenderGrid();
                    pollInterval = setInterval(updateMyPresence, 30000);
                    gridRefreshInterval = setInterval(loadAndRenderGrid, 30000);
                }
            }
        })();
    </script>
</body>
</html>
