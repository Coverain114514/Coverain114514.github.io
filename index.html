<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disabled_Hijackers's Availability Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 8px; }
        .utc-note {
            text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 15px;
        }
        .login-panel {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; max-width: 600px; margin: 0 auto 20px;
            display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
        }
        .login-panel input {
            flex: 1; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #f0f6fc; min-width: 200px;
        }
        .login-panel button {
            padding: 8px 18px; background: #238636; border: 1px solid #2ea043;
            border-radius: 6px; color: white; cursor: pointer; font-weight: 600;
        }
        .user-badge {
            text-align: center; margin-bottom: 8px; font-size: 0.9rem; color: #8b949e;
        }
        .user-badge strong { color: #f0c040; }
        .admin-panel {
            text-align: center; margin-bottom: 15px; display: none;
        }
        .admin-panel button {
            padding: 8px 20px; background: #c0392b; border: 1px solid #e74c3c;
            border-radius: 6px; color: white; cursor: pointer; font-weight: 600;
        }
        .admin-panel button:hover { background: #e74c3c; }
        .grid-container {
            overflow-x: auto; background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 10px; margin-bottom: 15px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; table-layout: fixed; }
        th, td { border: 1px solid #21262d; padding: 4px 2px; text-align: center; font-size: 0.68rem; vertical-align: middle; }
        th { background: #21262d; color: #58a6ff; position: sticky; top: 0; z-index: 3; }
        .time-header { font-size: 0.65rem; white-space: nowrap; }
        td.available {
            background: rgba(46, 204, 113, 0.18);
            color: #2ecc71;
            font-weight: bold;
            cursor: pointer;
        }
        td.mine {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            font-weight: bold;
            cursor: pointer;
        }
        td.empty-slot { color: #484f58; cursor: pointer; }
        td.empty-slot:hover { background: #1e2a3a; }
        .legend { display: flex; justify-content: center; gap: 18px; margin: 10px 0; font-size: 0.8rem; }
        .legend span::before { content: '■'; margin-right: 5px; }
        .legend .legend-available::before { color: rgba(46, 204, 113, 0.18); }
        .legend .legend-mine::before { color: rgba(241, 196, 15, 0.2); }
        .refresh-note { text-align: center; font-size: 0.75rem; color: #484f58; margin-top: 10px; }
        .debug-box {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px; margin: 10px auto 20px; max-width: 700px;
            font-family: monospace; font-size: 0.75rem; color: #8b949e;
            white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Disabled_Hijackers's Availability Planner</h1>
    <div class="utc-note">All times are in UTC+0 · Click a slot to toggle your availability</div>

    <div class="login-panel">
        <input type="text" id="apiKeyInput" placeholder="Paste your Torn API key">
        <button id="loginBtn" onclick="window.handleLogin()">🔑 Sign In</button>
    </div>

    <div id="userBadge" class="user-badge" style="display:none;">
        Signed in as <strong id="userNameDisplay"></strong> (ID: <strong id="userIdDisplay"></strong>)
    </div>

    <div id="adminPanel" class="admin-panel">
        <button onclick="window.clearAllData()">⚠️ Clear All Availability Data</button>
    </div>

    <div class="legend">
        <span class="legend-available">Others available</span>
        <span class="legend-mine">My availability</span>
    </div>

    <div class="grid-container" id="gridContainer">
        <p style="text-align:center;padding:30px;color:#8b949e;">Sign in to view and select your available times.</p>
    </div>

    <div class="debug-box" id="debugBox">
        <strong>🔍 Status</strong><br>
        (Waiting for action...)
    </div>
    <div class="refresh-note">Data auto‑refreshes every 60 seconds</div>

    <script>
        // ========== SUPABASE CONFIG ==========
        const SUPABASE_URL = 'https://ohgvzzcojnjqzvyizyxs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oZ3Z6emNvam5qcXp2eWl6eXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0MDUsImV4cCI6MjEwMjA0MzQwNX0.RR2L4Unhzs9nZC8_FfNoiBSS5bJSOWYJVYzSTZjZR4M';

        const DAYS = ['Today', 'Tomorrow', 'Day+2', 'Day+3', 'Day+4', 'Day+5', 'Day+6'];
        const SLOTS = 48; // half-hour slots
        const ADMIN_ID = '3086281'; // Coverain114514

        let currentUser = null; // { id: string, name: string }
        let availabilityData = [];
        let gridRefreshInterval = null;

        function logToDebug(msg) {
            const box = document.getElementById('debugBox');
            if (box) box.innerHTML += '\n' + msg;
            console.log(msg);
        }

        function clearDebug() {
            document.getElementById('debugBox').innerHTML = '<strong>🔍 Status</strong><br>(Waiting for action...)';
        }

        // ---------- Helpers ----------
        function getFutureWeekDates() {
            const dates = [];
            const now = new Date();
            for (let i = 0; i < 7; i++) {
                const d = new Date(now);
                d.setUTCDate(now.getUTCDate() + i);
                const year = d.getUTCFullYear();
                const month = String(d.getUTCMonth() + 1).padStart(2, '0');
                const day = String(d.getUTCDate()).padStart(2, '0');
                dates.push(`${year}-${month}-${day}`);
            }
            return dates;
        }

        function getSlotTime(slot) {
            const h = String(Math.floor(slot / 2)).padStart(2, '0');
            const m = slot % 2 === 0 ? '00' : '30';
            return `${h}:${m}`;
        }

        // ---------- Torn API ----------
        async function fetchBasic(key) {
            const url = `https://api.torn.com/user/?selections=basic&key=${key}`;
            const res = await fetch(url);
            const json = await res.json();
            if (json.error) throw new Error(json.error.error || json.error);
            return json;
        }

        async function verifyTornKey(key) {
            try {
                const data = await fetchBasic(key);
                if (!data.player_id) throw new Error('Missing player_id');
                // 将 player_id 转换为字符串，确保后续比较一致
                return { id: String(data.player_id), name: data.name };
            } catch (err) {
                logToDebug('[Torn] Verification failed: ' + err.message);
                return null;
            }
        }

        // ---------- Supabase REST ----------
        function supabaseHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        async function fetchAvailability(dates) {
            const dateList = dates.map(d => `"${d}"`).join(',');
            const url = `${SUPABASE_URL}/rest/v1/availability?date=in.(${encodeURIComponent(dateList)})&select=*`;
            const res = await fetch(url, { headers: supabaseHeaders() });
            if (!res.ok) {
                logToDebug('Fetch failed: ' + res.status + ' ' + (await res.text()));
                return [];
            }
            const data = await res.json();
            logToDebug(`✅ Fetched ${data.length} availability records`);
            return data;
        }

        async function toggleAvailability(userId, userName, date, slot) {
            // 确保 userId 为字符串
            const uid = String(userId);
            const checkUrl = `${SUPABASE_URL}/rest/v1/availability?user_id=eq.${encodeURIComponent(uid)}&date=eq.${encodeURIComponent(date)}&slot=eq.${slot}&select=id`;
            let res = await fetch(checkUrl, { headers: supabaseHeaders() });
            if (!res.ok) {
                logToDebug('Toggle check failed: ' + res.status);
                return;
            }
            const existing = await res.json();

            if (existing.length > 0) {
                // 删除自己的标记
                const deleteUrl = `${SUPABASE_URL}/rest/v1/availability?id=eq.${existing[0].id}`;
                res = await fetch(deleteUrl, { method: 'DELETE', headers: supabaseHeaders() });
                if (res.ok) {
                    logToDebug(`🗑️ Removed your availability at ${date} slot ${slot}`);
                } else {
                    logToDebug('Delete failed: ' + (await res.json()).message);
                }
            } else {
                // 插入新标记
                const insertUrl = `${SUPABASE_URL}/rest/v1/availability`;
                res = await fetch(insertUrl, {
                    method: 'POST',
                    headers: supabaseHeaders(),
                    body: JSON.stringify({
                        user_id: uid,
                        user_name: userName,
                        date: date,
                        slot: slot,
                        timestamp: Date.now()
                    })
                });
                if (res.ok) {
                    logToDebug(`✅ Marked yourself available at ${date} slot ${slot}`);
                } else {
                    logToDebug('Insert failed: ' + JSON.stringify(await res.json()));
                }
            }
            await loadAndRenderGrid();
        }

        async function clearAllAvailability() {
            const url = `${SUPABASE_URL}/rest/v1/availability?select=id`;
            const res = await fetch(url, { headers: supabaseHeaders() });
            if (!res.ok) {
                logToDebug('Fetch for clear failed: ' + res.status);
                return;
            }
            const records = await res.json();
            const promises = [];
            for (const rec of records) {
                const delUrl = `${SUPABASE_URL}/rest/v1/availability?id=eq.${rec.id}`;
                promises.push(fetch(delUrl, { method: 'DELETE', headers: supabaseHeaders() }));
            }
            await Promise.all(promises);
            logToDebug(`🗑️ Cleared ${records.length} availability records.`);
            await loadAndRenderGrid();
        }

        // ---------- Render grid ----------
        function renderGrid(dates, data) {
            const cellMap = {};
            data.forEach(row => {
                const key = `${row.date}_${row.slot}`;
                if (!cellMap[key]) cellMap[key] = [];
                // 确保 user_id 是字符串，方便比较
                cellMap[key].push({ userId: String(row.user_id), userName: row.user_name || `ID:${row.user_id}` });
            });

            let html = '<table><thead><tr><th>Time (UTC)</th>';
            dates.forEach((date, i) => {
                html += `<th>${DAYS[i]}<br>${date.slice(5)}</th>`;
            });
            html += '</tr></thead><tbody>';

            for (let s = 0; s < SLOTS; s++) {
                html += '<tr>';
                html += `<td class="time-header">${getSlotTime(s)}</td>`;
                dates.forEach(date => {
                    const key = `${date}_${s}`;
                    const entries = cellMap[key] || [];
                    let cls = 'empty-slot';
                    let content = '';
                    if (entries.length > 0) {
                        const myEntry = entries.find(e => e.userId === currentUser.id);
                        if (myEntry) cls = 'mine'; else cls = 'available';
                        content = entries.map(e => e.userName).join('<br>');
                    }
                    html += `<td class="${cls}" data-date="${date}" data-slot="${s}">${content}</td>`;
                });
                html += '</tr>';
            }
            html += '</tbody></table>';

            const gridContainer = document.getElementById('gridContainer');
            gridContainer.innerHTML = html;

            // 绑定点击事件
            if (currentUser) {
                gridContainer.querySelectorAll('td[data-date]').forEach(td => {
                    td.addEventListener('click', async () => {
                        const date = td.dataset.date;
                        const slot = parseInt(td.dataset.slot);
                        await toggleAvailability(currentUser.id, currentUser.name, date, slot);
                    });
                });
            }
        }

        async function loadAndRenderGrid() {
            if (!currentUser) return;
            const dates = getFutureWeekDates();
            availabilityData = await fetchAvailability(dates);
            renderGrid(dates, availabilityData);
        }

        // ---------- Login ----------
        window.handleLogin = async function() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return alert('Please enter your Torn API key');

            clearDebug();
            logToDebug('Verifying API key...');
            const user = await verifyTornKey(key);
            if (!user) {
                alert('Invalid API key. Check debug log for details.');
                return;
            }

            currentUser = user;
            localStorage.setItem('torn_api_key', key);
            document.getElementById('userBadge').style.display = 'block';
            document.getElementById('userNameDisplay').textContent = user.name;
            document.getElementById('userIdDisplay').textContent = user.id;

            // 显示管理员清除按钮（现在 user.id 是字符串，可以正常比较）
            const adminPanel = document.getElementById('adminPanel');
            if (user.id === ADMIN_ID) {
                adminPanel.style.display = 'block';
            } else {
                adminPanel.style.display = 'none';
            }

            document.getElementById('loginBtn').textContent = '🔄 Signed in';
            logToDebug(`✅ Logged in as ${user.name} (ID: ${user.id})`);

            if (gridRefreshInterval) clearInterval(gridRefreshInterval);
            await loadAndRenderGrid();
            gridRefreshInterval = setInterval(loadAndRenderGrid, 60000);
        };

        window.clearAllData = async function() {
            if (!currentUser || currentUser.id !== ADMIN_ID) {
                alert('Only Coverain114514 can clear data.');
                return;
            }
            if (confirm('Are you sure you want to delete ALL availability data?')) {
                await clearAllAvailability();
            }
        };

        // Auto-login if key saved
        (async () => {
            const savedKey = localStorage.getItem('torn_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                await window.handleLogin();
            }
        })();
    </script>
</body>
</html>
