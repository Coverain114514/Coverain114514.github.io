<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disabled_Hijackers's members Online Schedule</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 8px; }
        .utc-note {
            text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 15px;
        }
        .login-panel {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; max-width: 620px; margin: 0 auto 20px;
            display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
        }
        .login-panel input {
            flex: 1; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #f0f6fc; min-width: 200px;
        }
        .login-panel button {
            padding: 8px 18px; background: #238636; border: 1px solid #2ea043;
            border-radius: 6px; color: white; cursor: pointer; font-weight: 600;
        }
        .user-badge {
            text-align: center; margin-bottom: 8px; font-size: 0.9rem; color: #8b949e;
        }
        .user-badge strong { color: #f0c040; }
        .status-indicator {
            text-align: center; margin-bottom: 8px; font-size: 0.95rem;
        }
        .status-online { color: #3fb950; font-weight: bold; }
        .status-offline { color: #f85149; font-weight: bold; }
        .debug-box {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px; margin: 10px auto 20px; max-width: 700px;
            font-family: monospace; font-size: 0.75rem; color: #8b949e;
            white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto;
        }
        .grid-container {
            overflow-x: auto; background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 10px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; table-layout: fixed; }
        th, td { border: 1px solid #21262d; padding: 6px 4px; text-align: center; font-size: 0.7rem; vertical-align: middle; }
        th { background: #21262d; color: #58a6ff; position: sticky; top: 0; z-index: 3; }
        .time-header { font-size: 0.7rem; white-space: nowrap; }
        td.marked {
            background: rgba(88, 166, 255, 0.2);
            color: #c9d1d9;
            font-weight: normal;
            font-size: 0.68rem;
            line-height: 1.3;
        }
        td.empty-slot { color: #484f58; }
        .legend { display: flex; justify-content: center; gap: 18px; margin: 10px 0 15px; font-size: 0.8rem; }
        .legend span::before { content: '■'; margin-right: 5px; color: rgba(88, 166, 255, 0.2); }
        .refresh-note { text-align: center; font-size: 0.75rem; color: #484f58; margin-top: 10px; }
        .manual-refresh {
            display: block; margin: 0 auto 10px; padding: 6px 16px;
            background: #30363d; border: 1px solid #58a6ff; color: #58a6ff;
            border-radius: 4px; cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Disabled_Hijackers's members Online Schedule</h1>
    <div class="utc-note">All times are in UTC+0</div>

    <div class="login-panel">
        <input type="text" id="apiKeyInput" placeholder="Paste your Torn API key">
        <button id="loginBtn" onclick="window.handleLogin()">🔑 Sign In</button>
    </div>

    <div id="userBadge" class="user-badge" style="display:none;">
        Signed in as <strong id="userNameDisplay"></strong> (ID: <strong id="userIdDisplay"></strong>)
    </div>

    <div id="onlineStatus" class="status-indicator" style="display:none;">
        Current Torn status: <span id="statusText"></span>
    </div>

    <button id="manualRefreshBtn" class="manual-refresh" onclick="window.handleManualRefresh()">🔄 Refresh Grid Now</button>

    <div class="legend"><span>Member online (this week)</span></div>

    <div class="grid-container" id="gridContainer">
        <p style="text-align:center;padding:30px;color:#8b949e;">Sign in to see the schedule.</p>
    </div>

    <div class="debug-box" id="debugBox">
        <strong>🔍 Status</strong><br>
        (Waiting for action...)
    </div>
    <div class="refresh-note">Auto‑checks every 30 seconds · Marks persist all week</div>

    <script>
        // ========== SUPABASE CONFIG ==========
        const SUPABASE_URL = 'https://ohgvzzcojnjqzvyizyxs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oZ3Z6emNvam5qcXp2eWl6eXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0MDUsImV4cCI6MjEwMjA0MzQwNX0.RR2L4Unhzs9nZC8_FfNoiBSS5bJSOWYJVYzSTZjZR4M';

        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const SLOTS = 48;

        let currentUser = null;
        let pollInterval = null;
        let gridRefreshInterval = null;

        function logToDebug(msg) {
            const box = document.getElementById('debugBox');
            if (box) box.innerHTML += '\n' + msg;
            console.log(msg);
        }

        function clearDebug() {
            document.getElementById('debugBox').innerHTML = '<strong>🔍 Status</strong><br>(Waiting for action...)';
        }

        // ---------- Helpers ----------
        function getCurrentWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            return Array.from({length: 7}, (_, i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d.toISOString().slice(0,10);
            });
        }

        function getSlotTime(slot) {
            const h = String(Math.floor(slot / 2)).padStart(2, '0');
            const m = slot % 2 === 0 ? '00' : '30';
            return `${h}:${m}`;
        }

        function getCurrentDateAndSlot() {
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();
            const slot = hours * 2 + (minutes >= 30 ? 1 : 0);
            return { date: dateStr, slot };
        }

        // ---------- Torn API ----------
        async function fetchBasic(key) {
            const url = `https://api.torn.com/user/?selections=basic&key=${key}`;
            const res = await fetch(url);
            const json = await res.json();
            if (json.error) throw new Error(json.error.error || json.error);
            return json;
        }

        async function verifyAndCheckOnline(key) {
            try {
                const data = await fetchBasic(key);
                if (!data.player_id) throw new Error('Missing player_id');
                return { user: { id: data.player_id, name: data.name }, online: true };
            } catch (err) {
                logToDebug('[Torn] Request failed: ' + err.message);
                return { user: null, online: false };
            }
        }

        // ---------- Supabase REST ----------
        function supabaseHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        async function upsertPresence(userId, userName, date, slot) {
            const checkUrl = `${SUPABASE_URL}/rest/v1/presence?user_id=eq.${encodeURIComponent(userId)}&date=eq.${encodeURIComponent(date)}&slot=eq.${slot}&select=id`;
            let res = await fetch(checkUrl, { headers: supabaseHeaders() });
            if (!res.ok) { logToDebug('[Supabase] Check failed: ' + res.status); return; }
            const existing = await res.json();

            if (existing.length === 0) {
                const insertUrl = `${SUPABASE_URL}/rest/v1/presence`;
                res = await fetch(insertUrl, {
                    method: 'POST',
                    headers: supabaseHeaders(),
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: userName,
                        date: date,
                        slot: slot,
                        timestamp: Date.now()
                    })
                });
                if (res.ok) logToDebug('✅ Marked slot ' + slot);
                else logToDebug('❌ Insert failed: ' + JSON.stringify(await res.json()));
            } else {
                const updateUrl = `${SUPABASE_URL}/rest/v1/presence?id=eq.${existing[0].id}`;
                res = await fetch(updateUrl, {
                    method: 'PATCH',
                    headers: supabaseHeaders(),
                    body: JSON.stringify({ timestamp: Date.now(), user_name: userName })
                });
                if (res.ok) logToDebug('🔄 Updated slot ' + slot);
                else logToDebug('❌ Update failed: ' + JSON.stringify(await res.json()));
            }
        }

        async function fetchPresence(dates) {
            const dateList = dates.map(d => `"${d}"`).join(',');
            const url = `${SUPABASE_URL}/rest/v1/presence?date=in.(${encodeURIComponent(dateList)})&select=*`;
            const res = await fetch(url, { headers: supabaseHeaders() });
            if (!res.ok) { logToDebug('Fetch failed: ' + res.status); return []; }
            return await res.json();
        }

        async function patchMissingName(recordId, userName) {
            const url = `${SUPABASE_URL}/rest/v1/presence?id=eq.${recordId}`;
            const res = await fetch(url, {
                method: 'PATCH',
                headers: supabaseHeaders(),
                body: JSON.stringify({ user_name: userName })
            });
            if (res.ok) logToDebug('🔧 Patched missing name for record ' + recordId);
            else logToDebug('Patch failed: ' + (await res.json()).message);
        }

        // ---------- Update presence ----------
        async function updateMyPresence() {
            if (!currentUser) return;
            const savedKey = localStorage.getItem('torn_api_key');
            if (!savedKey) return;

            clearDebug();
            logToDebug('Checking API connection...');
            const { user, online } = await verifyAndCheckOnline(savedKey);

            document.getElementById('onlineStatus').style.display = 'block';
            const statusText = document.getElementById('statusText');

            if (online && user) {
                statusText.innerHTML = '<span class="status-online">● ONLINE</span>';
                logToDebug(`✅ Online as ${user.name}`);
                const { date, slot } = getCurrentDateAndSlot();
                await upsertPresence(currentUser.id, currentUser.name, date, slot);
            } else {
                statusText.innerHTML = '<span class="status-offline">○ OFFLINE</span>';
                logToDebug('❌ Offline or API error');
            }
        }

        // ---------- Grid rendering (NO TIME) ----------
        async function loadAndRenderGrid() {
            logToDebug('📊 Loading grid...');
            const dates = getCurrentWeekDates();
            const data = await fetchPresence(dates);

            // Name map
            const nameMap = {};
            data.forEach(row => {
                if (row.user_name && row.user_id) nameMap[row.user_id] = row.user_name;
            });

            // Patch missing names
            data.forEach(row => {
                if (!row.user_name && row.user_id && nameMap[row.user_id]) {
                    patchMissingName(row.id, nameMap[row.user_id]);
                }
            });

            // Cell map
            const cellMap = {};
            data.forEach(row => {
                const key = `${row.date}_${row.slot}`;
                if (!cellMap[key]) cellMap[key] = new Set();
                const displayName = row.user_name || nameMap[row.user_id] || `ID:${row.user_id}`;
                cellMap[key].add(displayName);
            });

            let html = '<table><thead><tr><th>Time (UTC)</th>';
            dates.forEach((date, i) => {
                html += `<th>${DAYS[i]}<br>${date.slice(5)}</th>`;
            });
            html += '</tr></thead><tbody>';

            for (let s = 0; s < SLOTS; s++) {
                html += '<tr>';
                html += `<td class="time-header">${getSlotTime(s)}</td>`;
                dates.forEach(date => {
                    const key = `${date}_${s}`;
                    const names = cellMap[key] ? Array.from(cellMap[key]) : [];
                    if (names.length > 0) {
                        html += `<td class="marked">${names.join('<br>')}</td>`;
                    } else {
                        html += `<td class="empty-slot"></td>`;
                    }
                });
                html += '</tr>';
            }
            html += '</tbody></table>';
            document.getElementById('gridContainer').innerHTML = html;
            logToDebug('Grid ready.');
        }

        // ---------- Login ----------
        window.handleLogin = async function() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return alert('Please enter your Torn API key');

            clearDebug();
            logToDebug('Verifying...');
            const { user, online } = await verifyAndCheckOnline(key);
            if (!user) {
                alert('Invalid API key or Torn unreachable.');
                return;
            }

            currentUser = user;
            localStorage.setItem('torn_api_key', key);
            document.getElementById('userBadge').style.display = 'block';
            document.getElementById('userNameDisplay').textContent = user.name;
            document.getElementById('userIdDisplay').textContent = user.id;
            document.getElementById('loginBtn').textContent = '🔄 Signed in';
            logToDebug(`✅ Logged in as ${user.name}`);

            if (pollInterval) clearInterval(pollInterval);
            if (gridRefreshInterval) clearInterval(gridRefreshInterval);

            await updateMyPresence();
            await loadAndRenderGrid();

            pollInterval = setInterval(updateMyPresence, 30000);
            gridRefreshInterval = setInterval(loadAndRenderGrid, 30000);
        };

        window.handleManualRefresh = async function() {
            if (!currentUser) {
                alert('Please sign in first.');
                return;
            }
            await updateMyPresence();
            await loadAndRenderGrid();
        };

        // Auto-login
        (async () => {
            const savedKey = localStorage.getItem('torn_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                await window.handleLogin();
            }
        })();
    </script>
</body>
</html>
