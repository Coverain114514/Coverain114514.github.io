<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Live Online Grid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 12px;
        }
        .login-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            max-width: 520px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .login-panel input {
            flex: 1;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            min-width: 200px;
        }
        .login-panel button {
            padding: 8px 18px;
            background: #238636;
            border: 1px solid #2ea043;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .login-panel button:hover { background: #2ea043; }
        .user-badge {
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .user-badge strong { color: #f0c040; }

        .grid-container {
            overflow-x: auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #21262d;
            padding: 4px 2px;
            text-align: center;
            font-size: 0.7rem;
            height: 28px;
            vertical-align: middle;
        }
        th {
            background: #21262d;
            color: #58a6ff;
            position: sticky;
            top: 0;
            z-index: 3;
        }
        .day-col {
            background: #21262d;
            color: #f0c040;
            font-weight: bold;
            width: 70px;
        }
        .time-header { font-size: 0.65rem; white-space: nowrap; }
        td.online {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            font-weight: bold;
        }
        td.online::after {
            content: attr(data-count);
            font-size: 0.65rem;
            margin-left: 2px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 10px 0 15px;
            font-size: 0.8rem;
        }
        .legend span::before {
            content: '■';
            margin-right: 5px;
            color: rgba(88, 166, 255, 0.15);
        }
        .refresh-note {
            text-align: center;
            font-size: 0.75rem;
            color: #484f58;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🕒 Torn Live Online Grid</h1>

    <div class="login-panel">
        <input type="text" id="apiKeyInput" placeholder="Paste your Torn API key">
        <button id="loginBtn">🔑 Sign In</button>
    </div>

    <div id="userBadge" class="user-badge" style="display:none;">
        Signed in as <strong id="userNameDisplay"></strong> (ID: <strong id="userIdDisplay"></strong>)
    </div>

    <div class="legend"><span>Online (last 5 min)</span></div>

    <div class="grid-container" id="gridContainer">
        <p style="text-align:center;padding:30px;color:#8b949e;">Sign in with your Torn API key to view the live grid.</p>
    </div>
    <div class="refresh-note">Updates automatically every 30 seconds</div>

    <!-- Supabase SDK -->
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        // ========== REPLACE WITH YOUR SUPABASE CREDENTIALS ==========
        const SUPABASE_URL = 'https://ohgvzzcojnjqzvyizyxs.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oZ3Z6emNvam5qcXp2eWl6eXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0MDUsImV4cCI6MjEwMjA0MzQwNX0.RR2L4Unhzs9nZC8_FfNoiBSS5bJSOWYJVYzSTZjZR4M';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- Globals ----------
        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const SLOTS = 48;
        const ONLINE_THRESHOLD_SEC = 300; // 5 min

        let currentUser = null;
        let pollInterval = null;
        let gridRefreshInterval = null;

        // DOM elements
        const apiKeyInput = document.getElementById('apiKeyInput');
        const loginBtn = document.getElementById('loginBtn');
        const userBadge = document.getElementById('userBadge');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userIdDisplay = document.getElementById('userIdDisplay');
        const gridContainer = document.getElementById('gridContainer');

        // ---------- Utility ----------
        function getCurrentWeekDates() {
            const now = new Date();
            const day = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
            return Array.from({length: 7}, (_, i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d.toISOString().slice(0,10); // YYYY-MM-DD
            });
        }

        function getSlotTime(slot) {
            const h = String(Math.floor(slot / 2)).padStart(2, '0');
            const m = slot % 2 === 0 ? '00' : '30';
            return `${h}:${m}`;
        }

        // ---------- Torn API ----------
        async function verifyTornKey(key) {
            try {
                const res = await fetch(`https://api.torn.com/user/?selections=basic&key=${key}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error.error);
                return { id: data.player_id, name: data.name };
            } catch { return null; }
        }

        async function isUserOnline(key) {
            try {
                const res = await fetch(`https://api.torn.com/user/?selections=basic&key=${key}`);
                const data = await res.json();
                if (data.error) return false;
                const last = data.last_action?.timestamp;
                if (!last) return false;
                const now = Math.floor(Date.now() / 1000);
                return (now - last) < ONLINE_THRESHOLD_SEC;
            } catch { return false; }
        }

        function getCurrentDateAndSlot() {
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10);
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();
            const slot = hours * 2 + (minutes >= 30 ? 1 : 0);
            return { date: dateStr, slot };
        }

        // ---------- Supabase presence update ----------
        async function updateMyPresence() {
            if (!currentUser) return;
            const savedKey = localStorage.getItem('torn_api_key');
            if (!savedKey) return;

            const online = await isUserOnline(savedKey);
            const { date, slot } = getCurrentDateAndSlot();
            const now = Date.now();

            if (online) {
                // Upsert: insert or update timestamp
                const { error } = await supabase
                    .from('presence')
                    .upsert({
                        user_id: currentUser.id,
                        date: date,
                        slot: slot,
                        timestamp: now
                    }, { onConflict: 'user_id, date, slot' });
                if (error) console.error('Supabase upsert error:', error);
            } else {
                // Delete any existing entry for this slot (offline -> remove)
                const { error } = await supabase
                    .from('presence')
                    .delete()
                    .eq('user_id', currentUser.id)
                    .eq('date', date)
                    .eq('slot', slot);
                if (error) console.error('Supabase delete error:', error);
            }
        }

        // ---------- Load grid data ----------
        async function loadAndRenderGrid() {
            const dates = getCurrentWeekDates();
            const cutoff = Date.now() - ONLINE_THRESHOLD_SEC * 1000;

            // Fetch all presence records for this week that are fresh
            const { data, error } = await supabase
                .from('presence')
                .select('*')
                .in('date', dates)
                .gt('timestamp', cutoff);

            if (error) {
                console.error('Error loading presence:', error);
                return;
            }

            // Build cell map: { "date_slot": [user_id, ...] }
            const cellMap = {};
            data.forEach(row => {
                const cellKey = `${row.date}_${row.slot}`;
                if (!cellMap[cellKey]) cellMap[cellKey] = [];
                cellMap[cellKey].push(row.user_id);
            });

            renderGrid(dates, cellMap);
        }

        function renderGrid(dates, cellMap) {
            let html = '<table><thead><tr><th>Time</th>';
            dates.forEach((date, i) => {
                html += `<th>${DAYS[i]}<br>${date.slice(5)}</th>`;
            });
            html += '</tr></thead><tbody>';

            for (let s = 0; s < SLOTS; s++) {
                html += '<tr>';
                html += `<td class="time-header">${getSlotTime(s)}</td>`;
                dates.forEach(date => {
                    const cellKey = `${date}_${s}`;
                    const users = cellMap[cellKey] || [];
                    const count = users.length;
                    const cls = count > 0 ? 'online' : '';
                    html += `<td class="${cls}" data-count="${count > 1 ? count : ''}"></td>`;
                });
                html += '</tr>';
            }
            html += '</tbody></table>';
            gridContainer.innerHTML = html;
        }

        // ---------- Login ----------
        loginBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) return alert('Please enter your Torn API key');

            const user = await verifyTornKey(key);
            if (!user) {
                alert('Invalid API key. Please try again.');
                return;
            }

            currentUser = user;
            localStorage.setItem('torn_api_key', key);
            userBadge.style.display = 'block';
            userNameDisplay.textContent = user.name;
            userIdDisplay.textContent = user.id;
            loginBtn.textContent = '🔄 Signed in';

            if (pollInterval) clearInterval(pollInterval);
            await updateMyPresence();
            pollInterval = setInterval(updateMyPresence, 30000);

            if (gridRefreshInterval) clearInterval(gridRefreshInterval);
            await loadAndRenderGrid();
            gridRefreshInterval = setInterval(loadAndRenderGrid, 30000);
        });

        // Auto-login
        (async () => {
            const savedKey = localStorage.getItem('torn_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                const user = await verifyTornKey(savedKey);
                if (user) {
                    currentUser = user;
                    userBadge.style.display = 'block';
                    userNameDisplay.textContent = user.name;
                    userIdDisplay.textContent = user.id;
                    loginBtn.textContent = '🔄 Signed in';
                    await updateMyPresence();
                    pollInterval = setInterval(updateMyPresence, 30000);
                    await loadAndRenderGrid();
                    gridRefreshInterval = setInterval(loadAndRenderGrid, 30000);
                }
            }
        })();
    </script>
</body>
</html>
